<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f0;
      min-height: 100vh;
      padding: 32px 24px;
      color: #111;
    }

    /* ─── Header ─────────────────────────────── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }

    /* ─── Global Add Card Row ─────────────────── */
    .add-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .add-row input {
      flex: 1;
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1.5px solid #e2e2e2;
      background: #fff;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border 0.15s, box-shadow 0.15s;
      min-width: 0;
      max-width: 360px;
    }
    .add-row input::placeholder { color: #aaa; }
    .add-row input:focus { border-color: #bbb; box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }
    .add-row button {
      height: 42px;
      padding: 0 22px;
      border-radius: 10px;
      border: none;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .add-row button:hover { background: #333; }

    /* ─── Board ───────────────────────────────── */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 24px;
      align-items: start;   /* columns don't stretch to match each other */
    }
    @media (max-width: 700px) {
      .board { grid-template-columns: 1fr; }
    }

    /* ─── Column ──────────────────────────────── */
    .column {
      background: #fff;
      border-radius: 16px;
      border: 1.5px solid #ececec;
      padding: 18px 16px;
      height: fit-content;
      display: flex;
      flex-direction: column;
      transition: background 0.15s, border-color 0.15s;
    }
    .column.drag-over {
      background: #eef5ff;
      border-color: #b5d0fb;
    }

    .col-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .col-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .col-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .col-count {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      background: #f0f0f0;
      border-radius: 99px;
      padding: 1px 8px;
      min-width: 20px;
      text-align: center;
    }

    /* Column accent colors */
    .col-todo .col-dot    { background: #f59e0b; }
    .col-todo .col-label  { color: #b45309; }
    .col-inprogress .col-dot   { background: #3b82f6; }
    .col-inprogress .col-label { color: #1d4ed8; }
    .col-done .col-dot    { background: #22c55e; }
    .col-done .col-label  { color: #15803d; }

    /* ─── Cards ───────────────────────────────── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 464px;   /* ~8 cards × (50px + 8px gap) */
      overflow-y: auto;
      scrollbar-width: none;        /* Firefox */
      -ms-overflow-style: none;     /* IE / Edge */
    }
    .cards::-webkit-scrollbar { display: none; } /* Chrome / Safari */

    .card {
      background: #fff;
      border: 1.5px solid #ebebeb;
      border-left: 4px solid transparent;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: grab;
      transition: box-shadow 0.15s, opacity 0.15s, transform 0.1s;
      user-select: none;
    }
    .card:active { cursor: grabbing; }
    .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .card.dragging { opacity: 0.35; transform: scale(0.96); }

    .col-todo     .card { border-left-color: #f59e0b; }
    .col-inprogress .card { border-left-color: #3b82f6; }
    .col-done     .card { border-left-color: #22c55e; }

    .card-title {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      line-height: 1.4;
    }
    .col-done .card-title { text-decoration: line-through; color: #aaa; }

    .card-delete {
      opacity: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 16px;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 6px;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .card:hover .card-delete { opacity: 1; }
    .card-delete:hover { color: #666; background: #f0f0f0; }

    /* ─── Column inline-add button ────────────── */
    .col-add-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      margin-top: 10px;
      padding: 8px 10px;
      border: none;
      background: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .col-add-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    .col-todo     .col-add-btn { color: #b45309; }
    .col-todo     .col-add-btn:hover { background: #fef3c7; }
    .col-inprogress .col-add-btn { color: #1d4ed8; }
    .col-inprogress .col-add-btn:hover { background: #eff6ff; }
    .col-done     .col-add-btn { color: #15803d; }
    .col-done     .col-add-btn:hover { background: #f0fdf4; }

    /* ─── Inline add form ─────────────────────── */
    .inline-add-form {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .inline-add-form.visible { display: flex; }
    .inline-add-form input {
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1.5px solid #d1d5db;
      background: #fff;
      font-size: 13px;
      color: #333;
      outline: none;
      transition: border 0.15s, box-shadow 0.15s;
    }
    .inline-add-form input:focus {
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }
    .col-todo .inline-add-form input:focus     { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,0.15); }
    .col-inprogress .inline-add-form input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96,165,250,0.15); }
    .col-done .inline-add-form input:focus     { border-color: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,0.15); }

    .inline-add-actions {
      display: flex;
      gap: 6px;
    }
    .inline-add-confirm {
      flex: 1;
      height: 32px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .inline-add-confirm:hover { filter: brightness(1.1); }
    .col-todo     .inline-add-confirm { background: #f59e0b; }
    .col-inprogress .inline-add-confirm { background: #3b82f6; }
    .col-done     .inline-add-confirm { background: #22c55e; }

    .inline-add-cancel {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      border-radius: 8px;
      font-size: 16px;
      color: #aaa;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .inline-add-cancel:hover { background: #f3f4f6; color: #555; }

    /* ─── Ghost drop indicator ────────────────── */
    .drop-ghost {
      height: 42px;
      border-radius: 10px;
      background: #e8f0fe;
      border: 2px dashed #93b9f8;
      display: none;
    }
    .drag-over .drop-ghost { display: block; }

    /* ─── Floating drag clone ─────────────────── */
    #drag-clone {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform-origin: top left;
      opacity: 0.95;
      box-shadow: 0 12px 32px rgba(0,0,0,0.18);
      border-radius: 10px;
      rotate: 2deg;
      scale: 1.04;
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1 class="page-title">Kanban Board</h1>
</div>

<div class="board" id="board">

  <!-- TO DO -->
  <div class="column col-todo" data-col="todo" id="col-todo">
    <div class="col-header">
      <div class="col-dot"></div>
      <span class="col-label">To Do</span>
      <span class="col-count" id="count-todo">0</span>
    </div>
    <div class="cards" id="cards-todo">
      <div class="drop-ghost"></div>
    </div>
    <button class="col-add-btn" onclick="openInlineAdd('todo')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add To Do
    </button>
    <div class="inline-add-form" id="inline-form-todo">
      <input type="text" id="inline-input-todo" placeholder="Card title…" />
      <div class="inline-add-actions">
        <button class="inline-add-confirm" onclick="submitInlineAdd('todo')">Add card</button>
        <button class="inline-add-cancel" onclick="closeInlineAdd('todo')" title="Cancel">&#x2715;</button>
      </div>
    </div>
  </div>

  <!-- IN PROGRESS -->
  <div class="column col-inprogress" data-col="inprogress" id="col-inprogress">
    <div class="col-header">
      <div class="col-dot"></div>
      <span class="col-label">In Progress</span>
      <span class="col-count" id="count-inprogress">0</span>
    </div>
    <div class="cards" id="cards-inprogress">
      <div class="drop-ghost"></div>
    </div>
    <button class="col-add-btn" onclick="openInlineAdd('inprogress')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add In Progress
    </button>
    <div class="inline-add-form" id="inline-form-inprogress">
      <input type="text" id="inline-input-inprogress" placeholder="Card title…" />
      <div class="inline-add-actions">
        <button class="inline-add-confirm" onclick="submitInlineAdd('inprogress')">Add card</button>
        <button class="inline-add-cancel" onclick="closeInlineAdd('inprogress')" title="Cancel">&#x2715;</button>
      </div>
    </div>
  </div>

  <!-- DONE -->
  <div class="column col-done" data-col="done" id="col-done">
    <div class="col-header">
      <div class="col-dot"></div>
      <span class="col-label">Done</span>
      <span class="col-count" id="count-done">0</span>
    </div>
    <div class="cards" id="cards-done">
      <div class="drop-ghost"></div>
    </div>
    <button class="col-add-btn" onclick="openInlineAdd('done')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Done
    </button>
    <div class="inline-add-form" id="inline-form-done">
      <input type="text" id="inline-input-done" placeholder="Card title…" />
      <div class="inline-add-actions">
        <button class="inline-add-confirm" onclick="submitInlineAdd('done')">Add card</button>
        <button class="inline-add-cancel" onclick="closeInlineAdd('done')" title="Cancel">&#x2715;</button>
      </div>
    </div>
  </div>

</div>

<script>
  // ─── State ───────────────────────────────────────────────────────────────────
  let cards = [
    { id: 'c1', title: 'Sketch the video outline', col: 'todo' },
    { id: 'c2', title: 'Record voiceover',          col: 'todo' },
    { id: 'c3', title: 'Edit rough cut',             col: 'inprogress' },
    { id: 'c4', title: 'Publish thumbnail',          col: 'done' },
  ];

  const COLS = ['todo', 'inprogress', 'done'];

  let dragId = null, clone = null, offsetX = 0, offsetY = 0, overCol = null;

  // ─── Render ──────────────────────────────────────────────────────────────────
  function render() {
    COLS.forEach(col => {
      const container = document.getElementById('cards-' + col);
      const ghost     = container.querySelector('.drop-ghost');

      Array.from(container.children).forEach(child => {
        if (!child.classList.contains('drop-ghost')) child.remove();
      });

      cards.filter(c => c.col === col).forEach(card => {
        container.insertBefore(makeCardEl(card), ghost);
      });

      document.getElementById('count-' + col).textContent =
        cards.filter(c => c.col === col).length;
    });
  }

  function makeCardEl(card) {
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.id = card.id;

    const title = document.createElement('span');
    title.className = 'card-title';
    title.textContent = card.title;

    const del = document.createElement('button');
    del.className = 'card-delete';
    del.innerHTML = '&times;';
    del.title = 'Delete';
    del.addEventListener('mousedown', e => e.stopPropagation());
    del.addEventListener('click', e => {
      e.stopPropagation();
      cards = cards.filter(c => c.id !== card.id);
      render();
    });

    div.appendChild(title);
    div.appendChild(del);
    div.addEventListener('mousedown', onMouseDown);
    return div;
  }

  // ─── Global Add (top bar → always goes to To Do) ─────────────────────────────
  function addGlobalCard() {
    const input = document.getElementById('new-card-input');
    const title = input.value.trim();
    if (!title) { input.focus(); return; }
    cards.push({ id: 'c-' + Date.now(), title, col: 'todo' });
    input.value = '';
    render();
    input.focus();
  }
  document.getElementById('new-card-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addGlobalCard();
  });

  // ─── Per-column Inline Add ────────────────────────────────────────────────────
  function openInlineAdd(col) {
    // Close any other open form first
    COLS.forEach(c => {
      if (c !== col) closeInlineAdd(c);
    });
    const form  = document.getElementById('inline-form-' + col);
    const input = document.getElementById('inline-input-' + col);
    const btn   = document.querySelector('#col-' + col + ' .col-add-btn');
    form.classList.add('visible');
    btn.style.display = 'none';
    input.value = '';
    input.focus();
  }

  function closeInlineAdd(col) {
    const form = document.getElementById('inline-form-' + col);
    const btn  = document.querySelector('#col-' + col + ' .col-add-btn');
    form.classList.remove('visible');
    btn.style.display = '';
  }

  function submitInlineAdd(col) {
    const input = document.getElementById('inline-input-' + col);
    const title = input.value.trim();
    if (title) {
      cards.push({ id: 'c-' + Date.now(), title, col });
      render();
    }
    closeInlineAdd(col);
  }

  // Wire up Enter / Escape for inline inputs
  COLS.forEach(col => {
    document.getElementById('inline-input-' + col).addEventListener('keydown', e => {
      if (e.key === 'Enter')  submitInlineAdd(col);
      if (e.key === 'Escape') closeInlineAdd(col);
    });
  });

  // ─── Drag & Drop ─────────────────────────────────────────────────────────────
  function onMouseDown(e) {
    if (e.button !== 0) return;
    if (e.target.classList.contains('card-delete')) return;

    const cardEl = e.currentTarget;
    dragId = cardEl.dataset.id;

    const rect = cardEl.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    clone = cardEl.cloneNode(true);
    clone.id = 'drag-clone';
    clone.style.width  = rect.width  + 'px';
    clone.style.left   = rect.left   + 'px';
    clone.style.top    = rect.top    + 'px';
    const delBtn = clone.querySelector('.card-delete');
    if (delBtn) delBtn.style.opacity = '0';
    document.body.appendChild(clone);

    cardEl.classList.add('dragging');
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup',   onMouseUp);
    e.preventDefault();
  }

  function onMouseMove(e) {
    if (!clone) return;
    clone.style.left = (e.clientX - offsetX) + 'px';
    clone.style.top  = (e.clientY - offsetY) + 'px';

    let found = null;
    document.querySelectorAll('.column').forEach(col => {
      const r = col.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right &&
          e.clientY >= r.top  && e.clientY <= r.bottom) {
        found = col.dataset.col;
      }
      col.classList.remove('drag-over');
    });
    if (found) document.getElementById('col-' + found).classList.add('drag-over');
    overCol = found;
  }

  function onMouseUp() {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup',   onMouseUp);

    if (dragId && overCol) {
      cards = cards.map(c => c.id === dragId ? { ...c, col: overCol } : c);
    }

    if (clone) { clone.remove(); clone = null; }
    document.querySelectorAll('.card.dragging').forEach(el => el.classList.remove('dragging'));
    document.querySelectorAll('.column.drag-over').forEach(el => el.classList.remove('drag-over'));

    dragId = null; overCol = null;
    render();
  }

  // ─── Init ────────────────────────────────────────────────────────────────────
  render();
</script>
</body>
</html>
